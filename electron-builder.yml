# Installers: `npm run dist` builds the one for the machine you are on into dist/.
# Releases are built on all three systems by .github/workflows/release.yml. File names carry no
# version, so https://github.com/Manraj10/tartan/releases/latest/download/<name> always works.
appId: com.manraj.tartan # matches app.setAppUserModelId in src/main/index.ts
productName: Tartan
copyright: Copyright © 2026 Manraj Singh
directories:
  output: dist
  buildResources: build
# Everything the app needs at runtime is bundled into out/ by electron-vite. The window and tray
# icons are read from build/ at runtime, and build/ is left out unless listed explicitly.
files:
  - out/**
  - build/icon.ico
  - build/icon.png
  - package.json
asar: true
publish: null
toolsets:
  # The static AppImage runtime starts without libfuse2, which stock Ubuntu no longer ships.
  appimage: '1.0.3'

win:
  target: nsis
  icon: build/icon.ico
nsis:
  # One click, per user, no admin prompt: installs to %LOCALAPPDATA%\Programs\tartan.
  oneClick: true
  perMachine: false
  deleteAppDataOnUninstall: false # your semester and settings survive an uninstall
  include: build/installer.nsh # also removes the start-at-login entry
  shortcutName: Tartan
  artifactName: Tartan-Windows-Setup.${ext}

mac:
  target:
    - target: dmg
      arch: [arm64, x64]
  icon: build/icon.png
  category: public.app-category.productivity
  # No Apple Developer ID yet: sign ad hoc so Apple Silicon will run it. Gatekeeper still asks
  # once (see the README).
  identity: '-'
  hardenedRuntime: false # required with ad hoc signing, or the pre-signed Electron framework is rejected
dmg:
  artifactName: Tartan-macOS-${arch}.${ext}

linux:
  target: [AppImage, deb]
  icon: build/icon.png
  category: Office
  maintainer: Manraj <158596509+Manraj10@users.noreply.github.com>
  synopsis: Your semester in one desktop app
  # Names the .desktop file after package.json desktopName (com.manraj.tartan), which is also
  # Electron's Wayland app_id: GNOME matches windows and grants global shortcuts by it.
  syncDesktopName: true
appImage:
  artifactName: Tartan-Linux.${ext}
deb:
  artifactName: Tartan-Linux.${ext}
