name: Feature idea
description: Something Tartan could do for your semester
labels: [enhancement]
body:
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What are you trying to do, and what gets in the way today?
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What would help
      description: How you picture it working. Rough is fine.
  - type: textarea
    id: alternatives
    attributes:
      label: What you do instead now
